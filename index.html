<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kelma</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kelma">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1311" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Reem+Kufi:wght@600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: one narrow column, phone-first. Home = today's numbers + decks; Study = one card filling the screen, grade buttons pinned at the bottom. */
:root{
  --bg:#EDF1EF; --surface:#FAFCFB; --ink:#13201B; --muted:#58695F; --line:#D3DDD8;
  --accent:#0A6B55; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5;
  --target:#C22E24; --again:#AE3B2B; --easy:#2C5CA3;
  --f-ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar:"Noto Naskh Arabic", "Geeza Pro", "Arabic Typesetting", serif;
  --f-mark:"Reem Kufi", "Noto Naskh Arabic", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#151E1B; --ink:#E3EBE7; --muted:#93A59D; --line:#283631;
  --accent:#3CBF99; --accent-ink:#05231A; --accent-soft:#17342B;
  --target:#FF7062; --again:#F07B67; --easy:#80A7EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#151E1B; --ink:#E3EBE7; --muted:#93A59D; --line:#283631;
  --accent:#3CBF99; --accent-ink:#05231A; --accent-soft:#17342B;
  --target:#FF7062; --again:#F07B67; --easy:#80A7EC; color-scheme:dark}
html,body{height:100%}
body{margin:0}
.hint{font-size:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
.hint b{color:var(--ink)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;padding-block:18px 32px;display:flex;flex-direction:column;gap:22px;min-height:100%;box-sizing:border-box}
button,label.btn{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,label.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;min-height:48px;box-sizing:border-box}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.ghost{background:none;border:none;color:var(--muted);font-weight:700;padding:8px;min-height:40px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:baseline;gap:10px}
.mark .ar{font-family:var(--f-mark);font-size:30px;color:var(--accent);line-height:1}
.mark .lat{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.today{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num b{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.num span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.num.due b{color:var(--accent)}
.today .btn.primary{width:100%;font-size:18px;min-height:56px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.decks{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.deck{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 2px;border-bottom:1px solid var(--line);align-items:center}
.deck .name{font-weight:700;min-width:0;overflow-wrap:anywhere}
.deck .meta{grid-column:1;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.deck .acts{grid-row:1/3;grid-column:2;display:flex;gap:4px;align-items:center}
.deck .confirm{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--again);border-color:var(--again)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.status{font-size:15px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.status.err{background:transparent;border:1px solid var(--again);color:var(--again)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:2.5ch;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.fine{font-size:14px;color:var(--muted);margin:0;max-width:65ch}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* study */
.study{display:flex;flex-direction:column;gap:14px;flex:1}
.bar{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.left{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.card{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;min-height:300px}
.chip{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.word{font-family:var(--f-ar);font-size:clamp(40px,12vw,58px);line-height:1.5;font-weight:600;margin:0;overflow-wrap:anywhere}
.ex{font-family:var(--f-ar);font-size:24px;line-height:1.8;margin:0;max-width:30ch}
.ex mark.t{background:none;color:var(--target);font-weight:700}
.mean{font-size:26px;font-weight:700;margin:0;line-height:1.3}
.exen{font-size:16px;color:var(--muted);margin:0;max-width:36ch}
.ans{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;padding-top:16px;border-top:1px solid var(--line)}
.play{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.play.big{width:96px;height:96px}
.play svg{width:40%;height:40%}
.noaudio{font-size:13px;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades .btn{flex-direction:column;gap:0;min-height:64px;line-height:1.2}
.grades .btn small{font-weight:400;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.g0{color:var(--again)} .g1{color:var(--accent)} .g2{color:var(--easy)}
.reveal{width:100%;min-height:64px;font-size:18px}
.done{display:flex;flex-direction:column;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.done h3{margin:0;font-size:24px}
.done p{margin:0}

/* v2: progress panel, deck tiles, deck page, practice */
:root{--fire:#D9531E;--grow:#3E8E3A;--gold:#C9962B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fire:#FF8A4C;--grow:#7CCB6F;--gold:#E6B655}}
:root[data-theme="dark"]{--fire:#FF8A4C;--grow:#7CCB6F;--gold:#E6B655}
.prog-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:16px}
.streak{display:flex;align-items:center;gap:14px}
.streak .flame{font-size:44px;line-height:1}
.streak b{display:block;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.streak span{font-size:14px;color:var(--muted)}
.streak.zero .flame{filter:grayscale(1);opacity:.5}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.week .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px}
.week .met .dot{background:var(--fire);border-color:var(--fire);color:#fff}
.week .rest .dot{border-style:dashed;border-color:var(--muted)}
.week .now .dot{border-color:var(--fire)}
.week .now{color:var(--ink)}
.goal{display:flex;flex-direction:column;gap:6px}
.goal .lbl{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
.goal .lbl span{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.goal .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.goal .track i{display:block;height:100%;background:var(--fire);border-radius:5px}
.goal.met .lbl b{color:var(--grow)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
.tile .em{font-size:28px;line-height:1}
.tile b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted);line-height:1.2;display:block}
.today .line{display:flex;gap:16px;font-size:15px;color:var(--muted);flex-wrap:wrap}
.today .line b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn.focus{width:100%;min-height:52px;font-size:17px}
.decklist{display:flex;flex-direction:column;gap:8px}
.deckrow{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink);width:100%}
.deckrow .ic,.dhead .ic{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-ar);font-size:24px;font-weight:700;line-height:1}
.deckrow .name{font-weight:700;overflow-wrap:anywhere;min-width:0}
.deckrow .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.deckrow .go{color:var(--muted);font-size:22px}
.page{display:flex;flex-direction:column;gap:18px}
.dhead{display:flex;align-items:center;gap:14px}
.dhead .ic{width:60px;height:60px;font-size:30px}
.dhead h1{margin:0;font-size:22px;line-height:1.25;overflow-wrap:anywhere}
.dhead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.words{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.words div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.words .ar{font-family:var(--f-ar);font-size:20px;direction:rtl}
.words .en{color:var(--muted);font-size:14px;text-align:left}
.words .kw{font-size:14px}
.dangerlink{align-self:center;background:none;border:none;color:var(--again);font-weight:700;padding:12px;min-height:44px}
.warn{border:2px solid var(--again);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.warn h1{margin:0;font-size:22px}
.warn ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.warn label{font-weight:700;font-size:15px}
.warn input{font:inherit;font-size:20px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);letter-spacing:.1em;text-transform:uppercase;width:100%}
.btn.solid-danger{background:var(--again);border-color:var(--again);color:#fff}
.pick{display:flex;flex-direction:column;gap:8px}
.pick label{display:grid;grid-template-columns:28px 48px 1fr;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.pick input{width:22px;height:22px;accent-color:var(--accent)}
.pick .ic{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-ar);font-size:24px;font-weight:700}
.pick .name{font-weight:700;overflow-wrap:anywhere}
.pick .meta{font-size:13px;color:var(--muted)}
.mode{font-size:13px;font-weight:700;color:var(--fire);white-space:nowrap}
.done .big{font-size:48px;line-height:1}
.outdated{display:flex;gap:10px;align-items:center;text-decoration:none;font-size:15px;font-weight:700;padding:12px 14px;border-radius:12px;border:2px solid var(--gold);color:var(--ink);background:var(--surface)}
.outdated span{flex:1;text-align:left}
.outdated{width:100%;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.upd .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.upd .st{display:flex;gap:12px;align-items:center}
.upd textarea{width:100%;min-height:120px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink)}
.upd .ok{font-weight:700;color:var(--accent);font-size:15px}
.rename{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.rename input{font:inherit;font-size:20px;font-weight:700;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.edit{background:none;border:none;color:var(--muted);font-size:18px;padding:6px;min-height:40px;min-width:40px}
.dhead>div{flex:1;min-width:0}
.tagchip{font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 10px}
.types{display:flex;flex-wrap:wrap;gap:8px}
.types button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-weight:700;font-size:15px;min-height:40px;color:var(--ink)}
.types button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick label.all{grid-template-columns:28px 1fr}
.subhead{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 0 0}
.latest{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.latest-info{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:none;text-align:left;padding:0;color:var(--ink)}
.latest-info .ic{flex:none;width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-ar);font-size:24px;font-weight:700}
.latest-info>span:last-child{display:flex;flex-direction:column;min-width:0}
.latest .kick{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.latest .name{font-weight:700;overflow-wrap:anywhere}
.latest .meta{font-size:13px;color:var(--muted)}
.homenav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.homenav .btn{flex-direction:column;gap:2px;min-height:64px;font-size:20px;padding:8px 4px}
.homenav .btn span{font-size:13px}
.month{border-top:1px solid var(--line);padding-top:8px}
.month summary{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:8px 2px;cursor:pointer;list-style:none}
.month summary::-webkit-details-marker{display:none}
.month summary::before{content:'›';display:inline-block;margin-right:8px;transition:transform .15s;color:var(--muted)}
.month[open] summary::before{transform:rotate(90deg)}
.month summary span:first-child{flex:1}
.month .meta{font-size:13px;color:var(--muted);font-weight:400}
.month .decklist{padding-bottom:10px}
.search{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stage{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:14px;padding:10px 4px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.stage .em{font-size:26px;line-height:1.1}
.stage b{font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.stage span:last-child{font-size:13px;color:var(--muted)}
.stage.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stage-tip{margin:0;font-size:14px;line-height:1.4;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.wrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 2px;border:none;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.wrow.hid{opacity:.5}
.edit label:not(.btn){font-weight:700;font-size:14px;margin-top:4px}
.edit textarea,.edit select{font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.edit textarea[dir=rtl]{font-family:var(--f-ar);font-size:22px}
.audiobox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.audiobox .lbl{font-weight:700;flex:1 0 100%}
.audiobox .ok{color:var(--accent);font-weight:700;font-size:14px;flex:1 0 100%}
.paused{margin:0;font-size:14px;line-height:1.4;background:color-mix(in srgb,var(--gold) 16%,transparent);border-radius:10px;padding:8px 10px}
.badges{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.brow{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:color-mix(in srgb,var(--gold) 22%,transparent);font-size:22px;line-height:1}
.badge small{font-size:11px;font-weight:700;color:var(--ink);margin-top:2px}
.badge.next{background:none;border:2px dashed var(--line);opacity:.55}
.bfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.summary div{border:1px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;text-align:center}
.summary b{font-size:20px;font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted)}
.weekimg{width:100%;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.celebrate{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:rgba(0,0,0,.18);padding:20px}
.cel-card{position:relative;background:var(--surface);color:var(--ink);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .35s ease-out}
.cel-em{font-size:52px;line-height:1}
.cel-burst{position:absolute;left:50%;top:40%;width:0;height:0}
.cel-burst i{position:absolute;font-style:normal;font-size:22px;animation:fly .9s ease-out forwards;opacity:0}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(var(--x) - 50%),calc(var(--y) - 50%)) scale(1);opacity:0}}

.badges .track i,.sec .track i{display:block;height:100%;background:var(--accent);border-radius:4px}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

@media (prefers-reduced-motion: reduce){.prog i{transition:none}}

<body>

<div class="wrap" id="app"></div>
<input type="file" id="file" accept=".zip,application/zip">
<audio id="player" preload="auto"></audio>

<script src="jszip.min.js"></script>
<script>
(function(){
const STANDALONE=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const INSTR=6, APP_VERSION=17;
const TAGS={noun:['🏷️','Noun'],verb:['⚡','Verb'],adjective:['🎨','Adjective'],connector:['🔗','Connector'],question:['❓','Question'],phrase:['🗨️','Phrase'],proverb:['💬','Proverb'],verse:['📖','Verse'],spiritual:['🙏','Spiritual'],instruction:['📝','Instruction']};
const DAY=86400000, TYPES=['recognition','listening','production'];
const app=document.getElementById('app'), fileIn=document.getElementById('file'), player=document.getElementById('player');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const exHtml=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<mark class="t">$1</mark>').replace(/&lt;b&gt;(.+?)&lt;\/b&gt;/gi,'<mark class="t">$1</mark>');
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>';

/* ---------- storage (IndexedDB, on this device only) ---------- */
/* Profiles: the first (original) profile keeps the 'kelma' database, so existing cards are untouched.
   Each extra profile gets its own database 'kelma-<id>'. The profile list lives in the 'kelma' database. */
const dbs=new Map();let DBN='kelma';
function openNamed(name){if(dbs.has(name))return dbs.get(name);const p=new Promise((res,rej)=>{let r;try{r=indexedDB.open(name,2)}catch(e){rej(e);return}
  r.onupgradeneeded=()=>{const d=r.result,has=n=>d.objectStoreNames.contains(n);
    if(!has('decks'))d.createObjectStore('decks',{keyPath:'id'});if(!has('notes'))d.createObjectStore('notes',{keyPath:'id'});if(!has('cards'))d.createObjectStore('cards',{keyPath:'id'});
    if(!has('audio'))d.createObjectStore('audio');if(!has('meta'))d.createObjectStore('meta');if(!has('revlog'))d.createObjectStore('revlog')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});dbs.set(name,p);p.catch(()=>dbs.delete(name));return p}
const openDB=()=>openNamed(DBN);
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbName=id=>id==='main'?'kelma':'kelma-'+id;
let PROFILES=[{id:'main',name:'Me',kid:false}], CUR='main';
const curProfile=()=>PROFILES.find(p=>p.id===CUR)||PROFILES[0];
const isKid=()=>!!curProfile().kid;
async function loadProfiles(){try{const d=await openNamed('kelma');const p=await reqP(d.transaction('meta').objectStore('meta').get('profiles'));if(Array.isArray(p)&&p.length)PROFILES=p}catch(e){}}
async function saveProfiles(){const d=await openNamed('kelma');return new Promise((res,rej)=>{const t=d.transaction(['meta'],'readwrite');t.objectStore('meta').put(PROFILES,'profiles');t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function useProfile(id){CUR=id;DBN=dbName(id);try{sessionStorage.setItem('kelma-profile',id)}catch(e){}
  try{await openDB();await load();S.ok=true}catch(e){S.ok=false}}
async function getAll(s){const d=await openDB();return reqP(d.transaction(s).objectStore(s).getAll())}
async function get(s,k){const d=await openDB();return reqP(d.transaction(s).objectStore(s).get(k))}
async function write(stores,fn){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(stores,'readwrite');fn(t);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}

const S={decks:[],notes:new Map(),cards:[],settings:{newPerDay:15},newDone:{day:'',count:0},ok:true,pending:null,log:{},instrVer:null,instrAck:0,instrText:'',lastBackup:0};
let weekImg=null, weekBlob=null, editId=null, editAudio=null, editDel=false, combineSel=new Set(), stageTip='', status=null, view='home', sess=null, deckId=null, pickSel=null, pickAll=false, pickTypes=new Set(), renaming=false;

async function load(){
  S.decks=await getAll('decks');
  S.notes=new Map((await getAll('notes')).map(n=>[n.id,n]));
  S.allCards=await getAll('cards');
  S.cards=S.allCards.filter(c=>{const n=S.notes.get(c.noteId);return !(n&&n.hidden)});
  S.settings=(await get('meta','settings'))||{newPerDay:15};
  S.newDone=(await get('meta','newDone'))||{day:'',count:0};
  S.log=(await get('meta','log'))||{};
  const iv=await get('meta','instrVer');S.instrVer=(typeof iv==='number')?iv:null;
  S.lastBackup=(await get('meta','lastBackup'))||0;
  S.badges=(await get('meta','badges'))||{};
  S.snaps=(await get('meta','snaps'))||{};
  const ia=await get('meta','instrAck');S.instrAck=(typeof ia==='number')?ia:0;
  if(S.newDone.day!==dayKey())S.newDone={day:dayKey(),count:0};
}
const saveMeta=()=>write(['meta'],t=>{const m=t.objectStore('meta');m.put(S.settings,'settings');m.put(S.newDone,'newDone')}).catch(()=>{});
const logRev=(c,g,mode)=>{const t=Date.now();write(['revlog'],x=>x.objectStore('revlog').put({t,card:c.id,g,mode,ivl:c.interval,state:c.state},t+'|'+c.id)).catch(()=>{})};
const saveCard=c=>write(['cards'],t=>t.objectStore('cards').put(c)).catch(()=>{status={err:true,msg:'Could not save your progress on this device.'}});

/* ---------- scheduling ---------- */
const isDue=c=>(c.state==='review'||c.state==='learning')&&c.due<today0()+DAY;
const BACKLOG=100;
const backlogged=()=>!isKid()&&S.cards.filter(isDue).length>BACKLOG;
const newLeft=()=>backlogged()?0:Math.max(0,S.settings.newPerDay+(S.newDone.extra||0)-S.newDone.count);
/* Kid profiles: a hard cap on cards answered per day (reviews + new). Overdue cards just wait for another day. */
const capLeft=()=>Math.max(0,(S.settings.cap||15)+(S.newDone.capExtra||0)-(S.newDone.done||0));
function nextIv(c,g){
  if(g===0)return 0;
  if(c.state==='new')return g===2?3:1;
  if(c.state==='learning')return g===2?Math.max(2,c.interval+1):Math.max(1,c.interval);
  return g===2?Math.max(c.interval+2,Math.round(c.interval*c.ease*1.3)):Math.max(c.interval+1,Math.round(c.interval*c.ease));
}
const fmtIv=d=>d===0?'Again soon':d<30?d+(d===1?' day':' days'):d<365?Math.round(d/30)+' mo':(d/365).toFixed(1)+' yr';
function deckOf(c){return S.notes.get(c.noteId)?.deckId}
/* New cards: a word's next card (see → hear → say) unlocks the day after its previous card was first answered.
   Follow-up cards of words already started come before brand-new words; newest deck first. */
function eligibleNew(deckId){
  const order=new Map([...S.decks].sort((a,b)=>b.importedAt-a.importedAt).map((d,i)=>[d.id,i]));
  const by=new Map();S.cards.forEach(c=>{if(!by.has(c.noteId))by.set(c.noteId,[]);by.get(c.noteId).push(c)});
  const t0=today0(),follow=[],fresh=[];
  by.forEach((cs,nid)=>{
    const n=S.notes.get(nid);if(!n||(deckId&&n.deckId!==deckId))return;
    cs.sort((a,b)=>TYPES.indexOf(a.type)-TYPES.indexOf(b.type));
    const k=cs.findIndex(c=>c.state==='new');if(k<0)return;
    if(k===0){fresh.push([cs[0],n]);return}
    const prev=cs[k-1];if(prev.firstSeen&&prev.firstSeen>=t0)return;
    follow.push([cs[k],n]);
  });
  const srt=(a,b)=>((order.get(a[1].deckId)??0)-(order.get(b[1].deckId)??0))||(a[1].order-b[1].order);
  return [...follow.sort(srt),...fresh.sort(srt)].map(x=>x[0]);
}
/* Keep two cards of the same word at least 5 cards apart; if that's impossible (tiny queue), push the later one to the end. */
function spreadSiblings(q){
  const out=[],rest=q.slice(),GAP=5;
  while(rest.length){
    const recent=new Set(out.slice(-GAP).map(c=>c.noteId));
    let k=rest.findIndex(c=>!recent.has(c.noteId));if(k<0)k=0;
    out.push(rest.splice(k,1)[0]);
  }
  return out;
}
function buildQueue(deckId){
  const order=new Map([...S.decks].sort((a,b)=>b.importedAt-a.importedAt).map((d,i)=>[d.id,i]));
  const inDeck=c=>!deckId||deckOf(c)===deckId;
  const seen=new Set(), rev=[], nw=[];
  S.cards.filter(c=>isDue(c)&&inDeck(c)).sort((a,b)=>a.due-b.due).forEach(c=>{if(!seen.has(c.noteId)){seen.add(c.noteId);rev.push(c)}});
  let left=newLeft();const nseen=new Set();
  for(const c of eligibleNew(deckId)){if(left<=0)break;if(nseen.has(c.noteId))continue;nseen.add(c.noteId);nw.push(c);left--}
  const q=[];let i=0,j=0;
  while(i<rev.length||j<nw.length){if(i<rev.length)q.push(rev[i++]);if(i<rev.length)q.push(rev[i++]);if(j<nw.length)q.push(nw[j++])}
  const out=spreadSiblings(q).map(c=>c.id);
  return isKid()?out.slice(0,capLeft()):out;
}
function counts(deckId){
  const inDeck=c=>!deckId||deckOf(c)===deckId;
  const due=S.cards.filter(c=>isDue(c)&&inDeck(c)).length;
  const avail=S.cards.filter(c=>c.state==='new'&&inDeck(c)).length;
  const ready=eligibleNew(deckId).length;
  return {due,newToday:Math.min(ready,newLeft()),newTotal:avail,ready,today:isKid()?buildQueue(deckId).length:0};
}

/* ---------- import ---------- */
async function importFile(file){
  if(!window.JSZip){status={err:true,msg:'The zip reader did not load. Check your connection and reopen the page.'};render();return}
  status={msg:'Reading '+file.name+'…'};render();
  let zip;try{zip=await JSZip.loadAsync(file)}catch(e){status={err:true,msg:'That file is not a readable .zip. Pick the deck file your Claude project made.'};render();return}
  const find=n=>Object.values(zip.files).find(f=>!f.dir&&f.name.split('/').pop()===n&&!f.name.startsWith('__MACOSX'));
  const bk=find('backup.json');
  if(bk)return restore(zip,bk);
  const dj=find('deck.json');
  if(!dj){status={err:true,msg:'This zip has no deck.json inside. Ask your project to rebuild it in the Kelma format.'};render();return}
  let deck;try{deck=JSON.parse(await dj.async('string'))}catch(e){status={err:true,msg:'deck.json is not valid JSON. Ask your project to rebuild the file.'};render();return}
  if(!deck.deck_id||!Array.isArray(deck.cards)||!deck.cards.length){status={err:true,msg:'deck.json needs a deck_id and a list of cards.'};render();return}
  const base=dj.name.includes('/')?dj.name.slice(0,dj.name.lastIndexOf('/')+1):'';
  let clash=false;
  {const prevD=S.decks.find(d=>d.id===deck.deck_id);
   if(prevD){const old=new Set(deckNotes(prevD.id).map(n=>n.word)),inc=deck.cards.map(c=>c.word).filter(Boolean);
     const same=inc.filter(w=>old.has(w)).length;
     if(old.size&&inc.length&&same/Math.min(old.size,inc.length)<0.5){clash=true;let nid;do{nid=deck.deck_id+'-'+Math.random().toString(36).slice(2,6)}while(S.decks.some(d=>d.id===nid));deck.deck_id=nid}}}
  const notes=[],audio=[],missing=[];
  for(const [i,c] of deck.cards.entries()){
    if(!c.word||!c.meaning)continue;
    const num=c.num??i+1, id=deck.deck_id+'#'+num;
    let audioKey=null;
    if(c.audio){const f=zip.file(base+c.audio)||zip.file(c.audio);
      if(f){const buf=await f.async('arraybuffer');const ext=(c.audio.split('.').pop()||'').toLowerCase();
        audio.push([id,new Blob([buf],{type:ext==='m4a'?'audio/mp4':ext==='wav'?'audio/wav':ext==='ogg'?'audio/ogg':'audio/mpeg'})]);audioKey=id}
      else missing.push(num)}
    notes.push({id,deckId:deck.deck_id,order:Number(num)||i+1,num:String(num),word:c.word,meaning:c.meaning,example:c.example||'',example_en:c.example_en||'',tag:TAGS[String(c.tag||'').toLowerCase()]?String(c.tag).toLowerCase():'',audioKey});
  }
  const noAudio=!notes.some(n=>n.audioKey)&&!deck.cards.some(c=>c.audio);
  const kinds=noAudio?['recognition']:TYPES;
  /* Keep the person's own edits and hidden flags when a deck is re-imported */
  for(const n of notes){const old=S.notes.get(n.id);if(!old)continue;if(old.hidden)n.hidden=true;
    if(old.edited){['word','meaning','example','example_en','tag','audioKey'].forEach(k=>n[k]=old[k]);n.edited=true;for(let i=audio.length-1;i>=0;i--)if(audio[i][0]===n.id)audio.splice(i,1)}}
  const existing=new Set((S.allCards||S.cards).map(c=>c.id));let added=0,updated=0;const newCards=[];
  notes.forEach(n=>{let fresh=false;kinds.forEach(t=>{const id=n.id+':'+t;if(!existing.has(id)){fresh=true;newCards.push({id,noteId:n.id,type:t,state:'new',interval:0,ease:2.5,due:0,reps:0,lapses:0})}});fresh?added++:updated++});
  const prev=S.decks.find(d=>d.id===deck.deck_id);
  const drec={id:deck.deck_id,name:(prev&&prev.renamed)?prev.name:(deck.deck_name||deck.deck_id),importedAt:prev?prev.importedAt:Date.now()};
  if(prev&&prev.renamed)drec.renamed=true;
  if(noAudio)drec.noAudio=true;
  const ver=Number(deck.instructions_version)||0;
  try{await write(['decks','notes','cards','audio','meta'],t=>{t.objectStore('decks').put(drec);if(!noAudio)t.objectStore('meta').put(ver,'instrVer');notes.forEach(n=>t.objectStore('notes').put(n));newCards.forEach(c=>t.objectStore('cards').put(c));audio.forEach(([k,b])=>t.objectStore('audio').put(b,k))})}
  catch(e){status={err:true,msg:'Could not save the deck on this device. Your phone may be out of storage.'};render();return}
  if(!noAudio&&ver<INSTR&&S.instrAck>=INSTR){try{await write(['meta'],t=>t.objectStore('meta').put(-1,'instrAck'))}catch(e){}}
  await load();
  let msg=`Imported “${drec.name}”: ${added} new word${added===1?'':'s'}`+(noAudio?'':` (${added*3} cards)`)+(updated?`, ${updated} already here and updated, progress kept`:'')+'.';
  if(clash)msg+=' You already had a different deck with the same ID, so this was added as a new deck.';
  if(missing.length&&!noAudio)msg+=` No audio found for #${missing.join(', #')}.`;
  status={msg};render();
}
async function restore(zip,bk){
  let data;try{data=JSON.parse(await bk.async('string'))}catch(e){status={err:true,msg:'backup.json is damaged.'};render();return}
  const audio=[];
  for(const n of data.notes||[]){if(!n.audioPath)continue;const f=zip.file(n.audioPath);if(f){const buf=await f.async('arraybuffer');audio.push([n.audioKey,new Blob([buf],{type:n.audioType||'audio/mpeg'})])}}
  try{await write(['decks','notes','cards','audio','meta','revlog'],t=>{(data.revlog||[]).forEach(r=>{if(r&&r.t&&r.card)t.objectStore('revlog').put(r,r.t+'|'+r.card)});(data.decks||[]).forEach(d=>t.objectStore('decks').put(d));(data.notes||[]).forEach(n=>{const c={...n};delete c.audioPath;delete c.audioType;t.objectStore('notes').put(c)});(data.cards||[]).forEach(c=>t.objectStore('cards').put(c));audio.forEach(([k,b])=>t.objectStore('audio').put(b,k));if(data.settings)t.objectStore('meta').put(data.settings,'settings');if(data.log){const m={...S.log};Object.entries(data.log).forEach(([k,v])=>{const c=m[k];m[k]={n:Math.max(c?c.n:0,v.n||0),cleared:!!((c&&c.cleared)||v.cleared)}});t.objectStore('meta').put(m,'log')}})}
  catch(e){status={err:true,msg:'Could not restore the backup on this device.'};render();return}
  await load();status={msg:`Restored backup: ${(data.notes||[]).length} words with their review history.`};render();
}
async function backup(){
  if(!window.JSZip)return;
  status={msg:'Building backup…'};render();
  const zip=new JSZip(),notes=[];
  for(const n of S.notes.values()){const o={...n};if(n.audioKey){const b=await get('audio',n.audioKey);if(b){o.audioPath='audio/'+encodeURIComponent(n.audioKey).replace(/%/g,'_')+'.bin';o.audioType=b.type;zip.file(o.audioPath,b)}}notes.push(o)}
  let revlog=[];try{revlog=await getAll('revlog')}catch(e){}
  zip.file('backup.json',JSON.stringify({format:'kelma-backup-1',exportedAt:new Date().toISOString(),decks:S.decks,notes,cards:S.allCards||S.cards,settings:S.settings,log:S.log,revlog}));
  const blob=await zip.generateAsync({type:'blob'});
  const who=PROFILES.length>1?curProfile().name.replace(/[^\p{L}\p{N}]+/gu,'-').slice(0,20)+'-':'';
  S.pending={blob,name:'kelma-backup-'+who+dayKey()+'.zip',kind:'backup'};
  status={msg:'Backup ready ('+Math.max(1,Math.round(blob.size/1024))+' KB). Tap Save file, then choose Save to Files.'};render();
}
async function shareDeck(id){
  if(!window.JSZip)return;const d=S.decks.find(x=>x.id===id);if(!d)return;
  status={msg:'Getting the deck ready…'};render();
  const zip=new JSZip(),cards=[];const extOf=t=>/mp4|m4a|aac/.test(t)?'m4a':/wav/.test(t)?'wav':/ogg/.test(t)?'ogg':'mp3';
  for(const n of deckNotes(id).filter(n=>!n.hidden)){const c={num:Number(n.num)||n.order,word:n.word,meaning:n.meaning,example:n.example||'',example_en:n.example_en||'',tag:n.tag||''};
    if(n.audioKey){const b=await get('audio',n.audioKey);if(b){c.audio='audio/'+String(c.num).padStart(2,'0')+'.'+extOf(b.type||'');zip.file(c.audio,b)}}
    cards.push(c)}
  zip.file('deck.json',JSON.stringify({format:'kelma-deck-1',instructions_version:INSTR,deck_id:d.id,deck_name:d.name,cards},null,1));
  const blob=await zip.generateAsync({type:'blob'});
  const safe=d.name.replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').slice(0,40)||'deck';
  S.pending={blob,name:'kelma-'+safe+'.zip',kind:'deck',deckId:id};

/* Streak: count studied days going back from today. One missed day per Mon–Sun week is forgiven; a second miss in the same week ends the streak. Today never counts as missed. */
function streakInfo(){
  const keys=Object.keys(S.log).filter(dayMet).sort();
  const t0=today0(), rest=new Set();
  if(!keys.length)return {n:0,rest};
  const first=Date.parse(keys[0]+'T00:00:00');
  let n=0,d=t0;const used=new Set();
  for(let i=0;i<3000&&d>=first;i++,d=addDays(d,-1)){
    const k=iso(d);
    if(dayMet(k)){n++;continue}
    if(d===t0)continue;
    const wk=mondayOf(d);

    used.add(wk);rest.add(k);
  }

}

const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${unit} per week for the last ${vals.length} weeks: ${vals.join(', ')}">${bars}${lab}<text x="0" y="10" font-size="9" fill="var(--muted)">${mx}</text></svg>`;
}

async function doCombine(){
  const tgt=S.decks.find(x=>x.id===deckId);if(!tgt||!combineSel.size)return;
  const inp=document.getElementById('combine-name');const name=(inp&&inp.value.trim().slice(0,60))||tgt.name;
  let next=Math.max(0,...deckNotes(tgt.id).map(n=>Number(n.num)||n.order||0));
  const moves=[];// [oldNote,newNote]
  for(const sid of [...combineSel]){for(const n of deckNotes(sid)){next++;const nid=tgt.id+'#'+next;moves.push([n,{...n,id:nid,deckId:tgt.id,num:String(next),order:next,audioKey:n.audioKey?nid:null}])}}
  const cardMap=new Map();
  status={msg:'Combining…'};render();
  try{
    const blobs=new Map();for(const [o,nn] of moves){if(o.audioKey){const b=await get('audio',o.audioKey);if(b)blobs.set(nn.id,[o.audioKey,b])}}
    let rev=[];try{const db=await openDB();rev=await new Promise((res,rej)=>{const out=[];const r=db.transaction('revlog').objectStore('revlog').openCursor();r.onsuccess=e=>{const c=e.target.result;if(c){out.push([c.key,c.value]);c.continue()}else res(out)};r.onerror=()=>rej(r.error)})}catch(e){}
    await write(['decks','notes','cards','audio','revlog'],t=>{
      const N=t.objectStore('notes'),C=t.objectStore('cards'),A=t.objectStore('audio'),R=t.objectStore('revlog'),D=t.objectStore('decks');
      for(const [o,nn] of moves){
        N.delete(o.id);N.put(nn);
        S.allCards.filter(c=>c.noteId===o.id).forEach(c=>{const nc={...c,id:nn.id+':'+c.type,noteId:nn.id};cardMap.set(c.id,nc.id);C.delete(c.id);C.put(nc)});
        const bb=blobs.get(nn.id);if(bb){A.delete(bb[0]);A.put(bb[1],nn.id)}
      }
      rev.forEach(([k,v])=>{const nc=cardMap.get(v.card);if(nc){R.delete(k);R.put({...v,card:nc},v.t+'|'+nc)}});
      combineSel.forEach(id=>D.delete(id));
      const allSilent=!!tgt.noAudio&&[...combineSel].every(id=>(S.decks.find(x=>x.id===id)||{}).noAudio);
      const rec={...tgt,name,renamed:name!==tgt.name?true:!!tgt.renamed};if(allSilent)rec.noAudio=true;else delete rec.noAudio;D.put(rec);
    });
  }catch(e){status={err:true,msg:'Could not combine the decks. Nothing was changed.'};render();return}

}

    go('settings');status={msg:'✓ Saved.'};render();return}
  if(me&&me.value.trim())PROFILES[0].name=me.value.trim().slice(0,24);
  let id;do{id='p'+Math.random().toString(36).slice(2,8)}while(PROFILES.some(p=>p.id===id));
  PROFILES.push({id,name,kid});
  try{await saveProfiles();
    const d=await openNamed(dbName(id));
    await new Promise((res,rej)=>{const t=d.transaction(['meta'],'readwrite');t.objectStore('meta').put(kid?{newPerDay:5,cap:15}:{newPerDay:15},'settings');t.objectStore('meta').put(INSTR,'instrAck');t.oncomplete=()=>res();t.onerror=()=>rej(t.error)});
  }catch(e){PROFILES=PROFILES.filter(p=>p.id!==id);status={err:true,msg:'Could not add the profile on this device.'};render();return}
  editing=null;go('who');
}
async function removeProfile(){
  const p=PROFILES.find(x=>x.id===(editing&&editing.id));if(!p||p.id==='main')return;
  const typed=window.prompt('This deletes '+p.name+'’s decks and progress on this device. Type DELETE to confirm.');
  if(!typed||typed.trim().toUpperCase()!=='DELETE')return;
  PROFILES=PROFILES.filter(x=>x.id!==p.id);try{await saveProfiles()}catch(e){}
  try{(await openNamed(dbName(p.id))).close()}catch(e){}dbs.delete(dbName(p.id));try{indexedDB.deleteDatabase(dbName(p.id))}catch(e){}
  editing=null;await useProfile(PROFILES.length>1?PROFILES[0].id:'main');go(PROFILES.length>1?'who':'home');
}
function exit(){if(sess)sess.urls.forEach(u=>URL.revokeObjectURL(u));sess=null;player.pause();snapToday();go('home')}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==='study')startSession();
  else if(a==='learnMore'){S.newDone.extra=(S.newDone.extra||0)+10;saveMeta();if(sess)sess.urls.forEach(u=>URL.revokeObjectURL(u));startSession()}
  else if(a==='pick'){pickSel=null;pickAll=false;pickTypes=new Set();go('pick')}
  else if(a==='practiceSel'){const ids=pickAll?S.decks.map(d=>d.id):[...(pickSel||[])];if(ids.length&&pickCount())startPractice(ids,[...pickTypes])}
  else if(a==='ptype'){const t=el.dataset.t;pickTypes.has(t)?pickTypes.delete(t):pickTypes.add(t);render()}
  else if(a==='practiceDeck')startPractice([id]);
  else if(a==='practiceAgain')startPractice(sess.deckIds||[],sess.types||[]);
  else if(a==='deck'){deckId=id;go('deck')}
  else if(a==='home')go('home');
  else if(a==='reveal'){if(!sess.shown){sess.shown=true;render();autoplay()}}
  else if(a==='play'){e.stopPropagation();playCurrent()}
  else if(a==='grade')grade(+el.dataset.g);
  else if(a==='pgrade')pgrade(+el.dataset.g);
  else if(a==='exit')exit();
  else if(a==='askDelete')go('delete');
  else if(a==='decks')go('decks');
  else if(a==='combine'){combineSel=new Set();go('combine')}
  else if(a==='week')openWeek();
  else if(a==='progress'){snapToday();go('progress')}
  else if(a==='milestones')go('milestones');
  else if(a==='saveMyName')saveMyName();
  else if(a==='shareWeek')shareWeek();
  else if(a==='card'){editId=id;editAudio=null;editDel=false;go('card')}
  else if(a==='saveCard')saveCardEdit();
  else if(a==='toggleHide')toggleHide();
  else if(a==='askDelCard'){editDel=true;render()}
  else if(a==='cancelDelCard'){editDel=false;render()}
  else if(a==='deleteCard')deleteCard();
  else if(a==='editPlay'){const n=S.notes.get(editId);if(n&&n.audioKey)get('audio',n.audioKey).then(b=>{if(b){player.src=URL.createObjectURL(b);player.play().catch(()=>{})}})}
  else if(a==='doCombine')doCombine();
  else if(a==='stageTip'){stageTip=stageTip===el.dataset.k?'':el.dataset.k;render()}
  else if(a==='settings')go('settings');
  else if(a==='update'){loadInstr();go('update')}
  else if(a==='copyInstr'){const out=document.getElementById('copy-ok');const ok=()=>{out.textContent='✓ Copied. Now paste it in Claude.'};const fail=()=>{out.textContent='Copy didn’t work. Use the box below.';const d=app.querySelector('details');if(d)d.open=true};
    if(S.instrText&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(S.instrText).then(ok,fail);else fail()}
  else if(a==='instrDone')instrDone();
  else if(a==='rename'){renaming=true;render();const i=document.getElementById('deck-name');if(i){i.focus();i.select()}}
  else if(a==='cancelName'){renaming=false;render()}
  else if(a==='saveName')saveName(id);
  else if(a==='shareDeck')shareDeck(id);
  else if(a==='delete'){const inp=document.getElementById('del-confirm');if(inp&&inp.value.trim().toUpperCase()==='DELETE')deleteDeck(id)}
  else if(a==='newMinus'||a==='newPlus'){S.settings.newPerDay=Math.min(60,Math.max(0,S.settings.newPerDay+(a==='newPlus'?5:-5)));saveMeta();render()}
  else if(a==='backup')backup();
  else if(a==='bonus'){S.newDone.capExtra=(S.newDone.capExtra||0)+5;S.newDone.extra=(S.newDone.extra||0)+5;saveMeta();startSession()}
  else if(a==='capMinus'||a==='capPlus'){S.settings.cap=Math.min(40,Math.max(5,(S.settings.cap||15)+(a==='capPlus'?5:-5)));saveMeta();render()}
  else if(a==='kNewMinus'||a==='kNewPlus'){S.settings.newPerDay=Math.min(15,Math.max(1,S.settings.newPerDay+(a==='kNewPlus'?1:-1)));saveMeta();render()}
  else if(a==='who'){if(sess)exitQuiet();go('who')}
  else if(a==='pickProfile')switchTo(id);
  else if(a==='addProfile'){editing={kid:true};go('profile')}
  else if(a==='editProfile'){editing={id:CUR,kid:!!curProfile().kid};go('profile')}
  else if(a==='saveProfile')saveProfile();
  else if(a==='removeProfile')removeProfile();
  else if(a==='saveBackup')saveBackup();
});
app.addEventListener('input',e=>{
  if(e.target.id==='deck-search'){const q=e.target.value.trim().toLowerCase();let any=false;
    app.querySelectorAll('details.month').forEach(dt=>{let shown=0;dt.querySelectorAll('.deckrow').forEach(r=>{const ok=!q||r.dataset.s.includes(q);r.hidden=!ok;if(ok)shown++});dt.hidden=!shown;if(q&&shown)dt.open=true;if(shown)any=true});
    const nm=document.getElementById('no-match');if(nm)nm.hidden=any;return}
  if(e.target.id==='del-confirm'){const b=document.getElementById('del-go');if(b)b.disabled=e.target.value.trim().toUpperCase()!=='DELETE'}
});
app.addEventListener('change',async e=>{
  if(e.target.id==='e-audio'){const f=e.target.files&&e.target.files[0];if(!f)return;
    const keep=['e-word','e-mean','e-ex','e-exen','e-tag'].map(i=>[i,(document.getElementById(i)||{}).value]);
    const type=f.type||(/\.m4a$/i.test(f.name)?'audio/mp4':/\.mp3$/i.test(f.name)?'audio/mpeg':/\.wav$/i.test(f.name)?'audio/wav':'');
    const blob=new Blob([await f.arrayBuffer()],{type});
    if(!(await testAudio(blob))){status={err:true,msg:'This phone can’t play that file. Try an .m4a or .mp3 recording.'}}else{editAudio=blob;status=null}
    render();keep.forEach(([i,v])=>{const el=document.getElementById(i);if(el&&v!=null)el.value=v});return}
  const ds=e.target.dataset||{};
  if('pickall' in ds){pickAll=e.target.checked;render();return}
  if(ds.comb){const nm=document.getElementById('combine-name');const keep=nm?nm.value:null;e.target.checked?combineSel.add(ds.comb):combineSel.delete(ds.comb);render();const n2=document.getElementById('combine-name');if(n2&&keep!==null)n2.value=keep;return}
  if(!ds.pick)return;
  if(!pickSel)pickSel=new Set();e.target.checked?pickSel.add(ds.pick):pickSel.delete(ds.pick);render();
});
document.addEventListener('keydown',e=>{
  if(view!=='study'||!sess||!sess.queue.length)return;
  if(e.key===' '||e.key==='Enter'){if(!sess.shown){e.preventDefault();sess.shown=true;render();autoplay()}}
  else if(sess.shown&&sess.mode==='review'&&['1','2','3'].includes(e.key))grade(+e.key-1);
  else if(sess.shown&&sess.mode==='practice'&&['1','2'].includes(e.key))pgrade(+e.key-1);
  else if(e.key==='r')playCurrent();
});
fileIn.addEventListener('change',()=>{const f=fileIn.files[0];fileIn.value='';if(f){if(view!=='home')view='home';importFile(f)}});
async function loadInstr(){if(S.instrText)return;try{const r=await fetch('instructions.txt',{cache:'no-cache'});if(r.ok){S.instrText=await r.text();const b=document.getElementById('instr-box');if(b)b.value=S.instrText}}catch(e){}}
async function instrDone(){
  try{await write(['meta'],t=>t.objectStore('meta').put(INSTR,'instrAck'))}catch(e){}
  S.instrAck=INSTR;go('home');status={msg:'✓ Done. Your next deck will use the new instructions.'};render();
}
async function saveName(id){
  const i=document.getElementById('deck-name'),v=i?i.value.trim().slice(0,60):'';const d=S.decks.find(x=>x.id===id);
  if(!d||!v){renaming=false;render();return}
  const rec={...d,name:v,renamed:true};
  try{await write(['decks'],t=>t.objectStore('decks').put(rec))}catch(e){}
  await load();renaming=false;render();
}
async function deleteDeck(id){
  const noteIds=deckNotes(id).map(n=>n.id),set=new Set(noteIds);
  const cardIds=S.allCards.filter(c=>set.has(c.noteId)).map(c=>c.id);
  try{await write(['decks','notes','cards','audio'],t=>{t.objectStore('decks').delete(id);noteIds.forEach(n=>{t.objectStore('notes').delete(n);t.objectStore('audio').delete(n)});cardIds.forEach(c=>t.objectStore('cards').delete(c))})}catch(e){}
  await load();view='home';status={msg:'Deck deleted.'};render();window.scrollTo(0,0);
}

/* ---------- boot ---------- */
(async()=>{
  try{await openDB();await loadProfiles();
    let last=null;try{last=sessionStorage.getItem('kelma-profile')}catch(e){}
    if(PROFILES.length>1){if(last&&PROFILES.some(p=>p.id===last))await useProfile(last);else{await useProfile(PROFILES[0].id);view='who'}}
    else await load();
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}catch(e){S.ok=false}
  render();loadInstr();try{snapToday()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
})();
})();
