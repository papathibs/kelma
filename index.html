<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kelma</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kelma">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1311" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Reem+Kufi:wght@600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: one narrow column, phone-first. Home = today's numbers + decks; Study = one card filling the screen, grade buttons pinned at the bottom. */
:root{
  --bg:#EDF1EF; --surface:#FAFCFB; --ink:#13201B; --muted:#58695F; --line:#D3DDD8;
  --accent:#0A6B55; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5;
  --target:#C22E24; --again:#AE3B2B; --easy:#2C5CA3;
  --f-ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar:"Noto Naskh Arabic", "Geeza Pro", "Arabic Typesetting", serif;
  --f-mark:"Reem Kufi", "Noto Naskh Arabic", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#151E1B; --ink:#E3EBE7; --muted:#93A59D; --line:#283631;
  --accent:#3CBF99; --accent-ink:#05231A; --accent-soft:#17342B;
  --target:#FF7062; --again:#F07B67; --easy:#80A7EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#151E1B; --ink:#E3EBE7; --muted:#93A59D; --line:#283631;
  --accent:#3CBF99; --accent-ink:#05231A; --accent-soft:#17342B;
  --target:#FF7062; --again:#F07B67; --easy:#80A7EC; color-scheme:dark}
html,body{height:100%}
body{margin:0}
.hint{font-size:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
.hint b{color:var(--ink)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;padding-block:18px 32px;display:flex;flex-direction:column;gap:22px;min-height:100%;box-sizing:border-box}
button,label.btn{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,label.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;min-height:48px;box-sizing:border-box}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.ghost{background:none;border:none;color:var(--muted);font-weight:700;padding:8px;min-height:40px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:baseline;gap:10px}
.mark .ar{font-family:var(--f-mark);font-size:30px;color:var(--accent);line-height:1}
.mark .lat{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.today{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface));border:2px solid var(--accent);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num b{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.num span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.num.due b{color:var(--accent)}
.today .btn.primary{width:100%;font-size:18px;min-height:56px}
.doneday{margin:0;text-align:center;font-size:20px;font-weight:800;color:var(--grow)}
.today .keepgo{width:100%}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.decks{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.deck{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 2px;border-bottom:1px solid var(--line);align-items:center}
.deck .name{font-weight:700;min-width:0;overflow-wrap:anywhere}
.deck .meta{grid-column:1;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.deck .acts{grid-row:1/3;grid-column:2;display:flex;gap:4px;align-items:center}
.deck .confirm{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--again);border-color:var(--again)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.status{font-size:15px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.status.err{background:transparent;border:1px solid var(--again);color:var(--again)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:6px}
.setupcard{background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.setupcard .sh{display:flex;justify-content:space-between;align-items:baseline}.setupcard .sh span{color:var(--muted);font-size:14px}
.spath{display:flex;align-items:center}
.spath .sl{flex:1;height:3px;background:var(--line);min-width:4px}.spath .sl.dn{background:var(--accent)}
.sdot{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:17px;padding:0;color:var(--ink)}
.sdot.dn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.sdot.cur{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);width:44px;height:44px;font-size:20px}
.setupcard .btn.primary{width:100%;min-height:52px;font-size:17px}
.svlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.svrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left}
.svrow:first-child{border-top:none}.svrow>span:nth-child(2){flex:1;font-weight:700}.svrow .go{color:var(--muted)}
.step .stepbody{display:flex;flex-direction:column;gap:14px;font-size:16px;line-height:1.5}.step .stepbody p{margin:0}
.step .stepbody .btn{width:100%}.okline{color:var(--grow);font-weight:700}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.shots{display:flex;flex-direction:column;align-items:center;gap:22px}
.shots figure{margin:0;display:flex;flex-direction:column;gap:8px;width:100%;max-width:330px}
.shot{width:100%;border-radius:16px;border:1px solid var(--line);display:block;background:var(--line);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.shots figcaption{order:-1;font-size:16px;line-height:1.4}
.ldots{display:flex;gap:8px;justify-content:center}
.ldot{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:18px;padding:0;display:grid;place-items:center}
.ldot.dn{background:var(--accent-soft);border-color:var(--accent-soft)}.ldot.on{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.lt{margin:6px 0 0;font-size:22px;text-transform:none;letter-spacing:0;color:var(--ink)}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:8px}.lnav .btn{flex:1}
.mini{margin:0;padding-left:4px;list-style:none;display:flex;flex-direction:column;gap:6px}
.wachat{background:#E7DED4;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.wab{background:#D9FDD3;color:#111;border-radius:10px 10px 2px 10px;padding:6px 10px;max-width:80%;display:flex;align-items:flex-end;gap:10px;box-shadow:0 1px 1px rgba(0,0,0,.12);font-size:16px}
.wab .ar{font-family:var(--f-ar);font-size:20px}.wab small{font-size:11px;color:#667}
.wav{min-width:190px;align-items:center}.wav .pl{color:#556;font-size:14px}.wav .wf{flex:1;height:14px;background:repeating-linear-gradient(90deg,#8AA 0 2px,transparent 2px 5px);border-radius:3px;opacity:.7}
.wagap{height:10px}
.rmin{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rmin3{display:flex;gap:8px;flex-wrap:wrap}.rmin3 span{background:var(--accent-soft);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px}
.recipe{display:flex;flex-direction:column;gap:8px;margin-top:10px}.recipe h2{margin:0;font-size:20px;text-transform:none;letter-spacing:0;color:var(--ink)}.rask{margin:0}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.rword{font-family:var(--f-ar);font-size:32px;line-height:1.5;margin:0;font-weight:600}.rmean{font-size:18px;font-weight:700;margin:0}
.rex{font-family:var(--f-ar);font-size:20px;line-height:1.7;margin:4px 0 0}.rexen{font-size:14px;color:var(--muted);margin:0}
.radd{font-size:14px;color:var(--muted);border:1.5px dashed var(--line);border-radius:10px;padding:4px 10px;margin:4px 0 0}
.hgrp{margin-top:8px}.hgrp h2{margin:8px 2px}
.hlist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hq{border-top:1px solid var(--line)}.hq:first-child{border-top:none}
.hq summary{padding:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.hq summary::-webkit-details-marker{display:none}.hq summary::after{content:'›';color:var(--muted);transition:transform .15s}.hq[open] summary::after{transform:rotate(90deg)}
.ha{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;line-height:1.5}.ha p{margin:0}
.infob{background:none;border:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px;min-width:32px;min-height:32px;cursor:pointer}
.today .line{align-items:center}.today .line .sp{flex:1}
.fprow{display:flex;align-items:center;gap:6px}.fprow .btn{flex:1}
.imhelp{text-align:center;margin:8px 0 0;font-size:14px}.imhelp .linkbtn{color:var(--muted);font-weight:600;text-decoration:none}
.sintro{margin:0;line-height:1.5}
.hook{margin:0;font-size:26px;line-height:1.25}
.welcome{min-height:85vh;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:24px 8px}
.welcome .hook{font-size:34px}.welcome .sintro{font-size:18px}.welcome .btn{width:100%;min-height:56px;font-size:18px;margin-top:8px}
.welcome .mark{margin-bottom:12px}
.helpq{font-size:20px;padding:6px 8px}
.lessontip{display:flex;align-items:center;background:var(--surface);border:1.5px dashed var(--accent);border-radius:16px}
.lessontip .lt-go{flex:1;background:none;border:none;text-align:left;padding:14px 16px;font:inherit;color:var(--ink);font-size:16px}
.lessontip .lt-x{background:none;border:none;color:var(--muted);font-size:18px;padding:12px 16px;min-width:44px;min-height:44px}
.slist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.srow:first-child{border-top:none}
.sic{font-size:22px;flex:none;width:28px;text-align:center}
.stxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.stxt span{font-size:13px;color:var(--muted)}
.sact{flex:none}
.slink .go{color:var(--muted);font-size:20px}
.more summary{cursor:pointer;color:var(--muted);font-weight:700;padding:6px 2px}
.more .row{margin-top:8px}
.stepper output{min-width:2.5ch;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.fine{font-size:14px;color:var(--muted);margin:0;max-width:65ch}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* study */
.study{display:flex;flex-direction:column;gap:14px;flex:1}
.bar{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.left{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.card{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;min-height:300px}
.chip{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.word{font-family:var(--f-ar);font-size:clamp(40px,12vw,58px);line-height:1.5;font-weight:600;margin:0;overflow-wrap:anywhere}
.ex{font-family:var(--f-ar);font-size:24px;line-height:1.8;margin:0;max-width:30ch}
.ex mark.t{background:none;color:var(--target);font-weight:700}
.mean{font-size:26px;font-weight:700;margin:0;line-height:1.3}
.exen{font-size:16px;color:var(--muted);margin:0;max-width:36ch}
.ans{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;padding-top:16px;border-top:1px solid var(--line)}
.play{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.play.big{width:96px;height:96px}
.play svg{width:40%;height:40%}
.noaudio{font-size:13px;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades .btn{flex-direction:column;gap:0;min-height:64px;line-height:1.2}
.grades .btn small{font-weight:400;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.g0{color:var(--again)} .g1{color:var(--accent)} .g2{color:var(--easy)}
.reveal{width:100%;min-height:64px;font-size:18px}
.done{display:flex;flex-direction:column;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.done h3{margin:0;font-size:24px}
.done p{margin:0}

/* v2: progress panel, deck tiles, deck page, practice */
:root{--fire:#D9531E;--grow:#3E8E3A;--gold:#C9962B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fire:#FF8A4C;--grow:#7CCB6F;--gold:#E6B655}}
:root[data-theme="dark"]{--fire:#FF8A4C;--grow:#7CCB6F;--gold:#E6B655}
.prog-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:16px}
.streak{display:flex;align-items:center;gap:14px}
.streak .flame{font-size:44px;line-height:1}
.streak b{display:block;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.streak span{font-size:14px;color:var(--muted)}
.streak.zero .flame{filter:grayscale(1);opacity:.5}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.week .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px}
.week .met .dot{background:var(--fire);border-color:var(--fire);color:#fff}
.week .rest .dot{border-style:dashed;border-color:var(--muted)}
.week .now .dot{border-color:var(--fire)}
.week .now{color:var(--ink)}
.goal{display:flex;flex-direction:column;gap:6px}
.goal .lbl{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
.goal .lbl span{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.goal .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.goal .track i{display:block;height:100%;background:var(--fire);border-radius:5px}
.goal.met .lbl b{color:var(--grow)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
.tile .em{font-size:28px;line-height:1}
.tile b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted);line-height:1.2;display:block}
.today .line{display:flex;gap:16px;font-size:15px;color:var(--muted);flex-wrap:wrap}
.today .line b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn.focus{width:100%;min-height:52px;font-size:17px}
.decklist{display:flex;flex-direction:column;gap:8px}
.deckrow{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink);width:100%}
.deckrow .ic,.dhead .ic{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-ar);font-size:24px;font-weight:700;line-height:1}
.deckrow .name{font-weight:700;overflow-wrap:anywhere;min-width:0}
.deckrow .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.deckrow .go{color:var(--muted);font-size:22px}
.page{display:flex;flex-direction:column;gap:18px}
.dhead{display:flex;align-items:center;gap:14px}
.dhead .ic{width:60px;height:60px;font-size:30px}
.dhead h1{margin:0;font-size:22px;line-height:1.25;overflow-wrap:anywhere}
.dhead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.words{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.words div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.words .ar{font-family:var(--f-ar);font-size:20px;direction:rtl}
.words .en{color:var(--muted);font-size:14px;text-align:left}
.words .kw{font-size:14px}
.dangerlink{align-self:center;background:none;border:none;color:var(--again);font-weight:700;padding:12px;min-height:44px}
.warn{border:2px solid var(--again);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.warn h1{margin:0;font-size:22px}
.warn ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.warn label{font-weight:700;font-size:15px}
.warn input{font:inherit;font-size:20px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);letter-spacing:.1em;text-transform:uppercase;width:100%}
.btn.solid-danger{background:var(--again);border-color:var(--again);color:#fff}
.pick{display:flex;flex-direction:column;gap:8px}
.pick label{display:grid;grid-template-columns:28px 48px 1fr;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.pick input{width:22px;height:22px;accent-color:var(--accent)}
.pick .ic{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-ar);font-size:24px;font-weight:700}
.pick .name{font-weight:700;overflow-wrap:anywhere}
.pick .meta{font-size:13px;color:var(--muted)}
.mode{font-size:13px;font-weight:700;color:var(--fire);white-space:nowrap}

<body>

<div class="wrap" id="app"></div>
<input type="file" id="file" accept=".zip,application/zip">
<audio id="player" preload="auto"></audio>

<script src="jszip.min.js"></script>
<script>
(function(){
const STANDALONE=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const INSTR=8, APP_VERSION=38;
const TAGS={noun:['🏷️','Noun'],verb:['⚡','Verb'],adjective:['🎨','Adjective'],connector:['🔗','Connector'],question:['❓','Question'],phrase:['🗨️','Phrase'],proverb:['💬','Proverb'],verse:['📖','Verse'],spiritual:['🙏','Spiritual'],instruction:['📝','Instruction']};
const DAY=86400000, TYPES=['listening','recognition','production'];
const app=document.getElementById('app'), fileIn=document.getElementById('file'), player=document.getElementById('player');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const exHtml=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<mark class="t">$1</mark>').replace(/&lt;b&gt;(.+?)&lt;\/b&gt;/gi,'<mark class="t">$1</mark>');
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>';

/* ---------- storage (IndexedDB, on this device only) ---------- */
/* Profiles: the first (original) profile keeps the 'kelma' database, so existing cards are untouched.
   Each extra profile gets its own database 'kelma-<id>'. The profile list lives in the 'kelma' database. */
const dbs=new Map();let DBN='kelma';
function openNamed(name){if(dbs.has(name))return dbs.get(name);const p=new Promise((res,rej)=>{let r;try{r=indexedDB.open(name,2)}catch(e){rej(e);return}
  r.onupgradeneeded=()=>{const d=r.result,has=n=>d.objectStoreNames.contains(n);
    if(!has('decks'))d.createObjectStore('decks',{keyPath:'id'});if(!has('notes'))d.createObjectStore('notes',{keyPath:'id'});if(!has('cards'))d.createObjectStore('cards',{keyPath:'id'});
    if(!has('audio'))d.createObjectStore('audio');if(!has('meta'))d.createObjectStore('meta');if(!has('revlog'))d.createObjectStore('revlog')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});dbs.set(name,p);p.catch(()=>dbs.delete(name));return p}
const openDB=()=>openNamed(DBN);
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbName=id=>id==='main'?'kelma':'kelma-'+id;
let PROFILES=[{id:'main',name:'Me',kid:false}], CUR='main';
const curProfile=()=>PROFILES.find(p=>p.id===CUR)||PROFILES[0];
const isKid=()=>false; /* kid mode retired: profiles are just names */
async function loadProfiles(){try{const d=await openNamed('kelma');const p=await reqP(d.transaction('meta').objectStore('meta').get('profiles'));if(Array.isArray(p)&&p.length)PROFILES=p}catch(e){}}
async function saveProfiles(){const d=await openNamed('kelma');return new Promise((res,rej)=>{const t=d.transaction(['meta'],'readwrite');t.objectStore('meta').put(PROFILES,'profiles');t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function useProfile(id){CUR=id;DBN=dbName(id);try{sessionStorage.setItem('kelma-profile',id)}catch(e){}
  try{await openDB();await load();S.ok=true}catch(e){S.ok=false}}
async function getAll(s){const d=await openDB();return reqP(d.transaction(s).objectStore(s).getAll())}
async function get(s,k){const d=await openDB();return reqP(d.transaction(s).objectStore(s).get(k))}
async function write(stores,fn){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(stores,'readwrite');fn(t);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}

const S={decks:[],notes:new Map(),cards:[],settings:{newPerDay:15},newDone:{day:'',count:0},ok:true,pending:null,log:{},instrVer:null,instrAck:0,instrText:'',lastBackup:0};
let editFrom='deck', weekImg=null, weekBlob=null, editId=null, editAudio=null, editDel=false, combineSel=new Set(), stageTip='', status=null, view='home', sess=null, deckId=null, pickSel=null, pickAll=false, pickTypes=new Set(), renaming=false;

async function load(){
  S.decks=await getAll('decks');
  S.notes=new Map((await getAll('notes')).map(n=>[n.id,n]));
  S.allCards=await getAll('cards');
  /* Every word gets at least 👁️ see + 🗣️ say. Older audio-free decks had only the see card: add the missing one, progress kept. */
  {const have=new Set(S.allCards.map(c=>c.id)),add=[];
   S.allCards.forEach(c=>{if(c.type==='recognition'){const id=c.noteId+':production';if(!have.has(id)){have.add(id);add.push({id,noteId:c.noteId,type:'production',state:'new',interval:0,ease:2.5,due:0,reps:0,lapses:0})}}});
   if(add.length){try{await write(['cards'],t=>{const st=t.objectStore('cards');add.forEach(c=>st.put(c))});S.allCards.push(...add)}catch(e){}}}
  S.cards=S.allCards.filter(c=>{const n=S.notes.get(c.noteId);return !(n&&n.hidden)});
  S.settings=(await get('meta','settings'))||{newPerDay:15};
  S.newDone=(await get('meta','newDone'))||{day:'',count:0};
  S.log=(await get('meta','log'))||{};
  const iv=await get('meta','instrVer');S.instrVer=(typeof iv==='number')?iv:null;
  S.lastBackup=(await get('meta','lastBackup'))||0;
  S.badges=(await get('meta','badges'))||{};
  S.snaps=(await get('meta','snaps'))||{};
  S.setup=(await get('meta','setup'))||{};
  const ia=await get('meta','instrAck');S.instrAck=(typeof ia==='number')?ia:0;
  if(S.newDone.day!==dayKey())S.newDone={day:dayKey(),count:0};
  S.loadedDay=dayKey();
}
/* New day while the app sat open in the background: reload today's cards. Never interrupts a review in progress. */
async function newDayCheck(){
  if(!S.loadedDay||S.loadedDay===dayKey()||(sess&&sess.queue.length))return;
  if(sess)exitQuiet();
  try{await load()}catch(e){return}
  if(view==='study')view='home';
  render();try{snapToday()}catch(e){}
}
const saveMeta=()=>write(['meta'],t=>{const m=t.objectStore('meta');m.put(S.settings,'settings');m.put(S.newDone,'newDone')}).catch(()=>{});
const logRev=(c,g,mode)=>{const t=Date.now();write(['revlog'],x=>x.objectStore('revlog').put({t,card:c.id,g,mode,ivl:c.interval,state:c.state},t+'|'+c.id)).catch(()=>{})};
const saveCard=c=>write(['cards'],t=>t.objectStore('cards').put(c)).catch(()=>{status={err:true,msg:'Could not save your progress on this device.'}});

/* ---------- scheduling ---------- */
const isDue=c=>(c.state==='review'||c.state==='learning')&&c.due<today0()+DAY;
const BACKLOG=100;
const backlogged=()=>!isKid()&&S.cards.filter(isDue).length>BACKLOG;
const newLeft=()=>backlogged()?0:Math.max(0,S.settings.newPerDay+(S.newDone.extra||0)-S.newDone.count);
/* Kid profiles: a hard cap on cards answered per day (reviews + new). Overdue cards just wait for another day. */
const capLeft=()=>Math.max(0,(S.settings.cap||15)+(S.newDone.capExtra||0)-(S.newDone.done||0));
function nextIv(c,g){
  if(g===0)return 0;
  if(c.state==='new')return g===2?3:1;
  if(c.state==='learning')return g===2?Math.max(2,c.interval+1):Math.max(1,c.interval);
  return g===2?Math.max(c.interval+2,Math.round(c.interval*c.ease*1.3)):Math.max(c.interval+1,Math.round(c.interval*c.ease));
}
const fmtIv=d=>d===0?'Again soon':d<30?d+(d===1?' day':' days'):d<365?Math.round(d/30)+' mo':(d/365).toFixed(1)+' yr';
function deckOf(c){return S.notes.get(c.noteId)?.deckId}
/* New cards: a word's next card (see → hear → say) unlocks the day after its previous card was first answered.
   Follow-up cards of words already started come before brand-new words; newest deck first. */
function eligibleNew(deckId){
  const order=new Map([...S.decks].sort((a,b)=>b.importedAt-a.importedAt).map((d,i)=>[d.id,i]));
  const by=new Map();S.cards.forEach(c=>{if(!by.has(c.noteId))by.set(c.noteId,[]);by.get(c.noteId).push(c)});
  const t0=today0(),follow=[],fresh=[];
  by.forEach((cs,nid)=>{
    const n=S.notes.get(nid);if(!n||(deckId&&n.deckId!==deckId))return;
    cs.sort((a,b)=>TYPES.indexOf(a.type)-TYPES.indexOf(b.type));
    const k=cs.findIndex(c=>c.state==='new');if(k<0)return;
    const seen=cs.filter(c=>c.state!=='new');
    if(!seen.length){fresh.push([cs[k],n]);return}
    /* Started words (also older words begun in the old see→hear order) continue the day after their last first-seen card. */
    if(seen.some(c=>c.firstSeen&&c.firstSeen>=t0))return;
    follow.push([cs[k],n]);
  });
  const srt=(a,b)=>((order.get(a[1].deckId)??0)-(order.get(b[1].deckId)??0))||(a[1].order-b[1].order);
  return [...follow.sort(srt),...fresh.sort(srt)].map(x=>x[0]);
}
/* Keep two cards of the same word at least 5 cards apart; if that's impossible (tiny queue), push the later one to the end. */
function spreadSiblings(q){
  const out=[],rest=q.slice(),GAP=5;
  while(rest.length){
    const recent=new Set(out.slice(-GAP).map(c=>c.noteId));
    let k=rest.findIndex(c=>!recent.has(c.noteId));if(k<0)k=0;
    out.push(rest.splice(k,1)[0]);
  }
  return out;
}
function buildQueue(deckId){
  const order=new Map([...S.decks].sort((a,b)=>b.importedAt-a.importedAt).map((d,i)=>[d.id,i]));

  const seen=new Set(), rev=[], nw=[];
  S.cards.filter(c=>isDue(c)&&inDeck(c)).sort((a,b)=>a.due-b.due).forEach(c=>{if(!seen.has(c.noteId)){seen.add(c.noteId);rev.push(c)}});

  for(const c of eligibleNew(deckId)){if(left<=0)break;if(nseen.has(c.noteId))continue;nseen.add(c.noteId);nw.push(c);left--}

}
function counts(deckId){

  return {due,newToday:Math.min(ready,newLeft()),newTotal:avail,ready,today:isKid()?buildQueue(deckId).length:0};
}

function waParse(text){
  text=String(text).replace(/\r/g,'').replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g,'').replace(/[\u202F\u00A0]/g,' ');

  const msgs=[];
  for(const line of text.split('\n')){
    const m=line.match(ios)||line.match(andr);
    if(m)msgs.push({date:m[1],time:m[2],who:m[3].trim(),text:m[4]});

  }
  for(const m of msgs){

    const att=m.text.match(/<(?:attached|pièce jointe|adjunto)\s*:\s*([^>]+)>/i)||m.text.match(/^(\S+\.[A-Za-z0-9]{2,5}) \((?:file attached|fichier joint|archivo adjunto)\)/i);

    else if(/^<?(media omitted|médias omis|multimedia omitido)>?$|^(audio|image|video|sticker|GIF|document) omitted$/i.test(m.text))m.kind='omitted';
    else if(!m.text||/^(this message was deleted|you deleted this message|messages and calls are end-to-end encrypted|ce message a été supprimé)/i.test(m.text))m.kind='system';

}
function waBuild(msgs){

  const cards=[],skipped=[];
  if(!helper)return {helper,cards,skipped,omitted:msgs.some(m=>m.kind==='omitted')};
  let buf=[];
  const short=s=>{s=String(s).replace(/\s+/g,' ');return s.length>60?s.slice(0,57)+'…':s};
  for(const m of msgs){
    if(m.who!==helper)continue;
    if(m.kind==='text')buf.push(m.text.replace(/\s*\n\s*/g,' ').trim());
    else if(m.kind==='audio'){
      if(!buf.length){skipped.push({why:'Voice note with nothing typed before it',what:m.date+' '+m.time});continue}
      const ar=buf.filter(t=>AR_RE.test(t)),en=buf.filter(t=>!AR_RE.test(t));buf=[];
      if(!ar.length){skipped.push({why:'No Darija in Arabic letters',what:short(en.join(' / '))});continue}
      if(!en.length){skipped.push({why:'No English',what:short(ar.join(' / '))});continue}
      cards.push({word:ar[0],meaning:en[0],example:ar[1]||'',example_en:en[1]||'',file:m.file,date:m.date,extra:Math.max(0,ar.length-2)+Math.max(0,en.length-2)});

  const have=new Map();[...S.notes.values()].forEach(x=>{const k=normAr(x.word);if(k&&!have.has(k))have.set(k,x)});

}

const QUOTES=[{"st": "early", "text": "People often ask me what it takes to become fluent in a new language. I tell them it takes a thousand cups of tea.", "who": "Preston Fidler"}, {"st": "early", "text": "Language learning is something we don’t have to do before we share the gospel, rather something we get to do while we share the gospel.", "who": "Preston Fidler"}, {"st": "early", "text": "As language learners, we can identify with Moses’ doubts. In our communication struggles, it’s easy to forget that God is with us and is ministering to us and through us by his presence.", "who": "Preston Fidler"}, {"st": "early", "text": "There are two simple facts that influence our ability to reach our lost neighbors with the gospel. First, we need to know our neighbors, and allow them to know us. This means meeting them, and spending time with them. Second, we need to be able to talk with them. This means engaging them in all sorts of conversational topics, however mundane.", "who": "Preston Fidler"}, {"st": "early", "text": "Reaching basic conversational fluency is without dispute the single most important first step as we consider our language learning task toward reaching gospel fluency.", "who": "Preston Fidler"}, {"st": "early", "text": "As intelligent language learners, iteration and continuous development become our primary path to rapid improvement, no matter how counter-intuitive they may seem. We become what I describe as language minimalists, suspending our needs for completeness, exactness, and perfection, and making the most of every resource right in front of us that we are able to utilize. We deliberately strive to get more from less, especially during that first 90 days of learning.", "who": "Preston Fidler"}, {"st": "early", "text": "Intelligent language learners as “language minimalists” enter a speech community with the goal to reach “basic conversational fluency” as rapidly and efficiently as possible through focused relentless extended linguistic interaction.", "who": "Preston Fidler"}, {"st": "early", "text": "Real change happens as we invest in learning new language, not through simply going to class or doing a program, but through the hard work of creative expression. We invest in reaching basic conversational fluency not through completing a series of lessons, but through immersing ourselves in the community of people who speak our new language, day in and day out.", "who": "Preston Fidler"}, {"st": "early", "text": "Immersion is measured in nano-seconds. Immersion is a second-by-second decision to die to self and come alive to the new language and culture God has called us to. It is being with people, in the moment, not just passing time with people in a place.", "who": "Preston Fidler"}, {"st": "early", "text": "The single most important thing we can do to learn the language is spend deliberate time with people using the language. Immersion is the essential choice to engage.", "who": "Preston Fidler"}, {"st": "early", "text": "Immersion in a speech community, in a geographic sense, is a myth. Many of us can be literally surrounded by the language, yet never really immerse. We can remain disconnected, orbiting the culture, never fully engaging.", "who": "Preston Fidler"}, {"st": "early", "text": "We cannot assume that our presence within a speech community naturally leads to language practice. Rather, immersion is defined by choices we make at any given moment to engage with people in their language, the language we are learning.", "who": "Preston Fidler"}, {"st": "early", "text": "Imagine English is the ocean and “learning Dutch” is Amsterdam. We need to build a system of dikes to keep the floodwaters of English at bay.", "who": "Preston Fidler"}, {"st": "early", "text": "Without doubt the most important thing we as language learners can do to improve our weak language is simply to use the language with people.", "who": "Preston Fidler"}, {"st": "early", "text": "As much as possible, let us aspire to enter into conversations with neighbors in their language with this mindset: “I am interested in being here with you. I want to engage in topics of common interest. I have been thinking about this. You are important to me.”", "who": "Preston Fidler"}, {"st": "middle", "text": "Gospel fluency begins most earnestly when we reach the point where we can understand a simple gospel passage from the Bible in our new language, and the gospel we understand in our new language feeds our minds and souls.", "who": "Preston Fidler"}, {"st": "middle", "text": "My best personal practice of gospel fluency is teaching the Bible to key people God brings into my life and having them teach it back to me.", "who": "Preston Fidler"}, {"st": "middle", "text": "How urgent is the task of personal evangelism? How urgent is the task of language learning? Until we can connect the dots between these two questions, we will tend to let language learning slide as other urgent items come across our desks or into our lives.", "who": "Preston Fidler"}, {"st": "middle", "text": "More than half of the task of communicating the gospel in other languages and cultures is listening to the response of people when they hear the gospel, understanding their response so that we know that they are understanding the gospel, and then engaging them meaningfully with the gospel.", "who": "Preston Fidler"}, {"st": "middle", "text": "The message of the gospel is communicated not only in the words we say. It is also, essentially, communicated in how we understand and respond to our hearers, as they hear the message, to be sure they understand the message.", "who": "Preston Fidler"}, {"st": "middle", "text": "Responsive listening is a skill that only comes through hours and hours with people in tough communication situations during which we develop listening skills and are able to practice responding to people in ways that are culturally meaningful, biblically sound, and full of godly wisdom.", "who": "Preston Fidler"}, {"st": "middle", "text": "We can never assume that what we are saying and teaching is being understood the way we intend. And the only way to confirm this is to invite response, understand that response, and meaningfully attend to that response.", "who": "Preston Fidler"}, {"st": "middle", "text": "Our goal is primarily not form or skill development, rather communicating our message clearly, accurately, and naturally. The practice of creative expression therefore takes our focus from the details and places it squarely on communicating the message, so that the details can take their place.", "who": "Preston Fidler"}, {"st": "middle", "text": "Therefore, it is always helpful when we can remind ourselves, or even better when someone else can remind us, that our choice to immerse in the language is not just an intelligent language choice, but it’s also an obedient and ultimately, deeply fulfilling choice, one that resonates with our call, as we begin to experience the joy of sharing the gospel with our dear neighbors.", "who": "Preston Fidler"}, {"st": "middle", "text": "What can I do today to reach out just a little bit further, to understand my neighbors just a little bit better; their families, their communities, and how they do life? How can I reach in just a little bit more, to probe a little deeper, to understand what makes my neighbors afraid, or sad, or to find out what they dream of, or hope for?", "who": "Preston Fidler"}, {"st": "middle", "text": "There is nothing inherently inspiring about failure, even when we know it’s a pathway to growth. It’s just hard. But there is everything inspiring–redeeming, actually–about the content, the story, that God is calling us to tell, and the anticipation we have in engaging people’s response as they hear the gospel.", "who": "Preston Fidler"}, {"st": "middle", "text": "What situations can we put ourselves into where we have a drowning sensation? We’re not actually drowning, but we must learn to push ourselves to the point of need and growth.", "who": "Preston Fidler"}, {"st": "late", "text": "Language learning is a life-long journey. We should never stop learning. The truth is, the more we learn, the more we realize how much more we have to learn. However, we should never be deceived into thinking that effective, clear, specific gospel proclamation is beyond our grasp to pursue right here and now.", "who": "Preston Fidler"}, {"st": "late", "text": "We hardly ever learn any more than we need to learn. We may imagine that by repetitively doing something, we are somehow slowly improving, but we’re really just doing the same thing, over and over again, without applying any further cognitive effort toward ongoing learning.", "who": "Preston Fidler"}, {"st": "late", "text": "What we need to realize is the road to continued language growth beyond the breakthrough point of basic conversational fluency is a deliberate choice, a conscious effort. We must choose to stay in the language learning zone.", "who": "Preston Fidler"}, {"st": "late", "text": "Regular practice simply isn’t enough to improve; we must watch ourselves fail, practice failing, and get feedback on how to improve.", "who": "Preston Fidler"}, {"st": "late", "text": "Gospel fluency therefore is not simply our ability to share the gospel in our new languages; it’s really more about our faith, our faithfulness, and our willingness to die to ourselves.", "who": "Preston Fidler"}, {"st": "late", "text": "It just does not follow that the gospel can be clearly proclaimed when our language is weak. But the bottom line is, our language could always be stronger than it is, right? Is it possible that God actually is able to, and chooses to demonstrate his strength to us, in us, and through us for the sake of the gospel as we endure weak language ability?", "who": "Preston Fidler"}, {"st": "late", "text": "Language is like a cracked kettle on which we beat out tunes for bears to dance to, while all the while we long to make music that will melt the stars.", "who": "Gustave Flaubert"}, {"st": "any", "text": "Let’s not confuse our goal. Our goal is not competence in learning the language. Our goal is fluently proclaiming the gospel.", "who": "Preston Fidler"}, {"st": "any", "text": "There are no ordinary people. You have never talked to a mere mortal. Nations, cultures, arts, civilizations–these are mortal, and their life is to ours as the life of a gnat. But it is immortals whom we joke with, work with, marry, snub, and exploit–immortal horrors or everlasting splendors.", "who": "C.S. Lewis"}, {"st": "any", "text": "Hearts soften and ears become attentive when people realize someone cares enough to listen and respond.", "who": "Preston Fidler"}, {"st": "any", "text": "If we ever wonder whether people hear and understand the gospel we share with them, all we have to do is ask.", "who": "Preston Fidler"}, {"st": "any", "text": "Fundamental to our success in language learning is the understanding that we are not called to learn the language, we are called to proclaim the gospel.", "who": "Preston Fidler"}, {"st": "any", "text": "We need to constantly evaluate our priorities as we relate to our neighbors. Learners who spend time with nationals generally make progress. Learners who don’t, generally won’t.", "who": "Preston Fidler"}, {"st": "any", "text": "Conversations, like tea, need to steep. They take time with people face to face.", "who": "Preston Fidler"}, {"st": "any", "text": "God gives us the gift of communication to bless.", "who": "Preston Fidler"}];

const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function weekRange(mon){const a=new Date(mon),b=new Date(addDays(mon,6));

function weekStats(mon){
  let cards=0,days=0;for(let i=0;i<7;i++){const k=iso(addDays(mon,i));cards+=(S.log[k]||{n:0}).n;if(dayMet(k))days++}
  const end=addDays(mon,7);const fresh=S.cards.filter(c=>c.type==='recognition'&&c.firstSeen&&c.firstSeen>=mon&&c.firstSeen<end).length;
  return {cards,days,fresh};
}

  if(c.state==='new'){S.newDone.count++;saveMeta();c.firstSeen=Date.now();if(c.type==='recognition')sess.newWords++}

  else if(a==='stageTip'){stageTip=stageTip===el.dataset.k?'':el.dataset.k;render()}
  else if(a==='settings')go('settings');
  else if(a==='update'){loadInstr();go('update')}
  else if(a==='copyInstr'){const out=document.getElementById('copy-ok');const ok=()=>{out.textContent='✓ Copied. Now paste it in Claude.'};const fail=()=>{out.textContent='Copy didn’t work. Use the box below.';const d=app.querySelector('details');if(d)d.open=true};
    if(S.instrText&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(S.instrText).then(ok,fail);else fail()}
  else if(a==='instrDone')instrDone();
  else if(a==='setupStep')openStep(el.dataset.k);
  else if(a==='setupTick'){const k=el.dataset.k;(async()=>{if(k==='instr'){try{await write(['meta'],t=>t.objectStore('meta').put(INSTR,'instrAck'))}catch(e){}S.instrAck=INSTR}await saveSetup({[k]:true});goNextStep()})()}
  else if(a==='setupNext')goNextStep();
  else if(a==='addStarter')addStarter();
  else if(a==='installOpen'||a==='installBack'){installOpen=a==='installOpen';render();window.scrollTo(0,0)}
  else if(a==='closeLessonTip'){saveSetup({lessonTipClosed:true}).then(render)}
  else if(a==='setupAll'){status=null;go('setup')}
  else if(a==='lesson'){lessonI=0;lessonMode='wa';go('lesson')}
  else if(a==='lessonClaude'){lessonI=0;lessonMode='claude';go('lesson')}
  else if(a==='claude')go('claude');
  else if(a==='lessonGo'){lessonI=+el.dataset.i;view='lesson';render();window.scrollTo(0,0)}
  else if(a==='recipes'){recipesFrom=view==='lesson'?'lesson':'home';go('recipes')}
  else if(a==='help'){helpOpen=el.dataset.q||null;status=null;view='help';render();if(!helpOpen)window.scrollTo(0,0)}
  else if(a==='lessonBack'){view='lesson';render();window.scrollTo(0,0)}
  else if(a==='rename'){renaming=true;render();const i=document.getElementById('deck-name');if(i){i.focus();i.select()}}
  else if(a==='cancelName'){renaming=false;render()}
  else if(a==='saveName')saveName(id);
  else if(a==='shareDeck')shareDeck(id);
  else if(a==='delete'){const inp=document.getElementById('del-confirm');if(inp&&inp.value.trim().toUpperCase()==='DELETE')deleteDeck(id)}
  else if(a==='newMinus'||a==='newPlus'){S.settings.newPerDay=Math.min(60,Math.max(0,S.settings.newPerDay+(a==='newPlus'?5:-5)));saveMeta();render()}
  else if(a==='backup')backup();
  else if(a==='bonus'){S.newDone.capExtra=(S.newDone.capExtra||0)+5;S.newDone.extra=(S.newDone.extra||0)+5;saveMeta();startSession()}
  else if(a==='capMinus'||a==='capPlus'){S.settings.cap=Math.min(40,Math.max(5,(S.settings.cap||15)+(a==='capPlus'?5:-5)));saveMeta();render()}
  else if(a==='kNewMinus'||a==='kNewPlus'){S.settings.newPerDay=Math.min(15,Math.max(1,S.settings.newPerDay+(a==='kNewPlus'?1:-1)));saveMeta();render()}
  else if(a==='who'){if(sess)exitQuiet();go('who')}
  else if(a==='pickProfile')switchTo(id);
  else if(a==='addProfile'){editing={kid:false};go('profile')}
  else if(a==='editProfile'){editing={id:CUR,kid:!!curProfile().kid};go('profile')}
  else if(a==='saveProfile')saveProfile();
  else if(a==='removeProfile')removeProfile();
  else if(a==='saveBackup')saveBackup();
});
app.addEventListener('input',e=>{
  if(e.target.id==='deck-search'){const q=e.target.value.trim().toLowerCase();let any=false;
    app.querySelectorAll('details.month').forEach(dt=>{let shown=0;dt.querySelectorAll('.deckrow').forEach(r=>{const ok=!q||r.dataset.s.includes(q);r.hidden=!ok;if(ok)shown++});dt.hidden=!shown;if(q&&shown)dt.open=true;if(shown)any=true});
    const nm=document.getElementById('no-match');if(nm)nm.hidden=any;return}
  if(e.target.id==='del-confirm'){const b=document.getElementById('del-go');if(b)b.disabled=e.target.value.trim().toUpperCase()!=='DELETE'}
});
app.addEventListener('change',async e=>{
  if(e.target.id==='e-audio'){const f=e.target.files&&e.target.files[0];if(!f)return;
    const keep=['e-word','e-mean','e-ex','e-exen','e-tag'].map(i=>[i,(document.getElementById(i)||{}).value]);
    const type=f.type||(/\.m4a$/i.test(f.name)?'audio/mp4':/\.mp3$/i.test(f.name)?'audio/mpeg':/\.wav$/i.test(f.name)?'audio/wav':'');
    const blob=new Blob([await f.arrayBuffer()],{type});
    if(!(await testAudio(blob))){status={err:true,msg:'This phone can’t play that file. Try an .m4a or .mp3 recording.'}}else{editAudio=blob;status=null}
    render();keep.forEach(([i,v])=>{const el=document.getElementById(i);if(el&&v!=null)el.value=v});return}
  const ds=e.target.dataset||{};
  if('pickall' in ds){pickAll=e.target.checked;render();return}
  if(ds.comb){const nm=document.getElementById('combine-name');const keep=nm?nm.value:null;e.target.checked?combineSel.add(ds.comb):combineSel.delete(ds.comb);render();const n2=document.getElementById('combine-name');if(n2&&keep!==null)n2.value=keep;return}
  if(!ds.pick)return;
  if(!pickSel)pickSel=new Set();e.target.checked?pickSel.add(ds.pick):pickSel.delete(ds.pick);render();
});
document.addEventListener('keydown',e=>{
  if(view!=='study'||!sess||!sess.queue.length)return;
  if(e.key===' '||e.key==='Enter'){if(!sess.shown){e.preventDefault();sess.shown=true;render();autoplay()}}
  else if(sess.shown&&sess.mode==='review'&&['1','2','3'].includes(e.key))grade(+e.key-1);
  else if(sess.shown&&sess.mode==='practice'&&['1','2'].includes(e.key))pgrade(+e.key-1);
  else if(e.key==='r')playCurrent();
});
fileIn.addEventListener('change',()=>{const f=fileIn.files[0];fileIn.value='';if(f){if(view!=='home')view='home';importFile(f)}});
async function loadInstr(){if(S.instrText)return;try{const r=await fetch('instructions.txt',{cache:'no-cache'});if(r.ok){S.instrText=await r.text();const b=document.getElementById('instr-box');if(b)b.value=S.instrText}}catch(e){}}
async function instrDone(){
  try{await write(['meta'],t=>t.objectStore('meta').put(INSTR,'instrAck'))}catch(e){}
  S.instrAck=INSTR;go('home');status={msg:'✓ Done. Your next deck will use the new instructions.'};render();
}
async function saveName(id){
  const i=document.getElementById('deck-name'),v=i?i.value.trim().slice(0,60):'';const d=S.decks.find(x=>x.id===id);
  if(!d||!v){renaming=false;render();return}
  const rec={...d,name:v,renamed:true};
  try{await write(['decks'],t=>t.objectStore('decks').put(rec))}catch(e){}
  await load();renaming=false;render();
}
async function deleteDeck(id){
  const noteIds=deckNotes(id).map(n=>n.id),set=new Set(noteIds);
  const cardIds=S.allCards.filter(c=>set.has(c.noteId)).map(c=>c.id);
  try{await write(['decks','notes','cards','audio'],t=>{t.objectStore('decks').delete(id);noteIds.forEach(n=>{t.objectStore('notes').delete(n);t.objectStore('audio').delete(n)});cardIds.forEach(c=>t.objectStore('cards').delete(c))})}catch(e){}
  await load();view='home';status={msg:'Deck deleted.'};render();window.scrollTo(0,0);
}

/* ---------- boot ---------- */
(async()=>{
  try{await openDB();await loadProfiles();
    let last=null;try{last=sessionStorage.getItem('kelma-profile')}catch(e){}
    if(PROFILES.length>1){if(last&&PROFILES.some(p=>p.id===last))await useProfile(last);else{await useProfile(PROFILES[0].id);view='who'}}
    else await load();
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}catch(e){S.ok=false}
  render();loadInstr();try{snapToday()}catch(e){}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')newDayCheck()});
  window.addEventListener('pageshow',newDayCheck);window.addEventListener('focus',newDayCheck);setInterval(newDayCheck,60000);
  if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
})();
})();
</script>
